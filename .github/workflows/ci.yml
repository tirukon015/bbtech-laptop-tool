# Builds the application and runs the unit tests on every push and pull request.
# The third-party tool bundle (third_party/, from TEST-Laptop.zip) is not in the repository, so CI
# builds the EXE without embedded tools; release builds are produced locally with build/build.ps1.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Unit tests
        run: dotnet test tests/BBTech.Core.Tests -c Release --logger "trx;LogFileName=test-results.trx" --results-directory test-results

      - name: Build application (without embedded tools)
        run: dotnet build src/BBTech.LaptopTool -c Release

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results
